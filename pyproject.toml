[project]
name = "embervault-workspace"
version = "1.0.0"
description = "EmberVault root workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "embervault-common",
    "embervault-db",
    "embervault-app",
    "embervault-orchestrator",
    "embervault-proxy",
    "embervault-portal",
]

[tool.uv.workspace]
members = [
    "packages/embervault-common",
    "packages/embervault-db",
    "services/app",
    "services/orchestrator",
    "services/proxy",
    "services/portal",
]

[tool.uv.sources]
embervault-common = { workspace = true }
embervault-db = { workspace = true }
embervault-app = { workspace = true }
embervault-orchestrator = { workspace = true }
embervault-proxy = { workspace = true }
embervault-portal = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "pre-commit>=4.0.0",
    "types-requests>=2.32.0",
    "hypothesis>=6.112.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # Critical pycodestyle errors
    "F",              # Pyflakes (undefined names, imports)
    "B",              # Flake8-bugbear (real bug prevention)
]
ignore = [
    "E501",           # line-length handled by formatter
    "E402",           # module import not at top (common in tests/monkeypatching)
    "E741",           # ambiguous variable name
    "E701",           # multiple statements on one line
    "B007",           # loop control variable not used
    "B008",           # function calls in default arguments
    "B904",           # raise from in except blocks
    "F841",           # local variable assigned but never used
    "F601",           # repeated dictionary key
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F821", "F841", "B011", "E741", "B007"]
"deploy/scripts/**" = ["F401", "F541", "F841"]

[tool.ruff.lint.isort]
known-first-party = [
    "embervault_common",
    "embervault_db",
    "embervault_app",
    "embervault_orchestrator",
    "embervault_proxy",
]

[tool.mypy]
python_version = "3.12"
strict = false
sqlite_cache = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false

[[tool.mypy.overrides]]
module = [
    "apprise.*",
    "apscheduler.*",
    "flask_babel.*",
    "flask_wtf.*",
    "importlinter.*",
    "ldap3.*",
    "qrcode.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"

[tool.importlinter]
root_packages = [
    "embervault_common",
    "embervault_db",
    "embervault_app",
    "embervault_orchestrator",
    "embervault_proxy",
]

[[tool.importlinter.contracts]]
name = "Proxy must only import from embervault_common"
type = "layers"
layers = [
    "embervault_proxy",
    "embervault_common",
]
ignore_imports = [
    "embervault_common.observability.metrics -> embervault_db.models.execution",
    "embervault_common.observability.metrics -> embervault_db.models.proxy",
    "embervault_common.observability.metrics -> embervault_db.models.remotes",
    "embervault_common.observability.metrics -> embervault_db.repositories.execution_repository",
]

[[tool.importlinter.contracts]]
name = "Strict unidirectional layers for DB and services"
type = "layers"
layers = [
    "embervault_app | embervault_orchestrator",
    "embervault_db",
    "embervault_common",
]
ignore_imports = [
    "embervault_common.observability.metrics -> embervault_db.models.execution",
    "embervault_common.observability.metrics -> embervault_db.models.proxy",
    "embervault_common.observability.metrics -> embervault_db.models.remotes",
    "embervault_common.observability.metrics -> embervault_db.repositories.execution_repository",
]

[[tool.importlinter.contracts]]
name = "Services must remain completely independent"
type = "independence"
modules = [
    "embervault_app",
    "embervault_orchestrator",
    "embervault_proxy",
]
