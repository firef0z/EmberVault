[project]
name = "embervault-common"
version = "1.0.0"
description = "EmberVault common library (no DB dependencies)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "ldap3>=2.9.1",
    "apprise>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
