[project]
name = "embervault-portal"
version = "1.0.0"
description = "EmberVault Public Share Portal for External End-Users"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.32.0",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

