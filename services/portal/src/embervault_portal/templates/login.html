{% extends "layout.html" %}

{% block title %}{{ _('portal_login_title') }} | {{ portal_app_name }}{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
  <div class="card" style="max-width: 440px; width: 100%; padding: 32px 28px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 52px; height: 52px; background: rgba(59, 130, 246, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: var(--color-brand);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 6px;">{{ _('portal_login_heading') }}</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">
        {{ _('portal_login_desc') }}
      </p>
    </div>

    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.88rem; display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/share/{{ token }}/login">
      <div style="margin-bottom: 18px;">
        <label for="username" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">{{ _('portal_username_label') }}</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username" autofocus placeholder="{{ _('portal_username_placeholder') }}" />
      </div>

      <div style="margin-bottom: 24px;">
        <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">{{ _('portal_password_label') }}</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="{{ _('portal_password_placeholder') }}" />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
        {{ _('portal_login_btn') }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
