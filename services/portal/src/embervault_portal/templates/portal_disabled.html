{% extends "layout.html" %}

{% block title %}{{ _('portal_disabled_title') }} | {{ portal_app_name }}{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 60px auto; padding: 0 16px;">
  <div class="card" style="padding: 32px 24px; text-align: center; border: 1px solid rgba(239, 68, 68, 0.3); background: rgba(30, 41, 59, 0.85); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: #ef4444;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
      </svg>
    </div>
    <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: #f8fafc;">
      {{ _('portal_disabled_heading') }}
    </h2>
    <p style="color: #94a3b8; font-size: 0.92rem; line-height: 1.5; margin-bottom: 24px;">
      {{ _('portal_disabled_desc') }}
    </p>
    <div style="padding: 10px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 6px; font-size: 0.82rem; color: #64748b;">
      {{ _('portal_disabled_contact', portal_app_name=portal_app_name) }}
    </div>
  </div>
</div>
{% endblock %}
