      <stop offset="0%" stop-color="#030916"/>
      <stop offset="45%" stop-color="#06142c"/>
      <stop offset="100%" stop-color="#040c1c"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="68%" cy="32%" r="55%">
