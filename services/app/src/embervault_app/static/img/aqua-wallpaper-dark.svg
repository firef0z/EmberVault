  <path d="M-50,740 C500,730 820,270 1360,310 C1760,340 1960,170 2050,70" fill="none" stroke="#4a9df2" stroke-width="2.5" stroke-opacity="0.28" filter="url(#glow)"/>
  <path d="M150,1300 C600,1100 950,580 1500,520 C1850,480 1980,380 2050,300 L2050,700 C1900,850 1600,920 1250,900 C800,880 500,1300 150,1300 Z" fill="url(#deepArc)" opacity="0.52"/>
