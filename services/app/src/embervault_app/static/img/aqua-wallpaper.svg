<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%">
  <defs>
    <!-- Base Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b387e"/>
      <stop offset="35%" stop-color="#165bb5"/>
      <stop offset="70%" stop-color="#1e74dc"/>
      <stop offset="100%" stop-color="#08295e"/>
    </linearGradient>

    <!-- Translucent Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#80d0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2a90f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a50b0" stop-opacity="0"/>
    </linearGradient>

    <!-- Translucent Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="10%" y1="100%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#00449e" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4db8ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#aae0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Deep Arc Gradient -->
    <linearGradient id="deepArc" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#041a3d" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#186dd6" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#5ec5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="sunGlow" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#64c8ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1a78e8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b387e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Ocean Blue Canvas -->
  <rect width="1920" height="1200" fill="url(#bgGrad)"/>
  <rect width="1920" height="1200" fill="url(#sunGlow)"/>

  <!-- Lower Back Wave -->
  <path d="M-100,1300 Q400,650 1100,850 T2100,600 L2100,1300 Z" fill="url(#waveGrad1)" filter="url(#glow)" opacity="0.7"/>

  <!-- Main Sweeping Aqua Swirl -->
  <path d="M-100,950 C300,950 650,450 1200,480 C1650,500 1850,250 2050,150 L2050,1300 L-100,1300 Z" fill="url(#waveGrad2)"/>

  <!-- Foreground Elegant Ribbon -->
  <path d="M-100,750 C450,750 800,280 1350,320 C1750,350 1950,180 2050,80 L2050,550 C1900,650 1650,750 1300,700 C750,620 400,1050 -100,1050 Z" fill="url(#waveGrad1)" opacity="0.85"/>

  <!-- High-Gloss White Arc Accent Line -->
  <path d="M-50,740 C500,730 820,270 1360,310 C1760,340 1960,170 2050,70" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.65" filter="url(#glow)"/>

  <!-- Secondary Ribbon Highlight -->
  <path d="M150,1300 C600,1100 950,580 1500,520 C1850,480 1980,380 2050,300 L2050,700 C1900,850 1600,920 1250,900 C800,880 500,1300 150,1300 Z" fill="url(#deepArc)" opacity="0.5"/>

  <path d="M200,1300 C650,1090 970,570 1510,510 C1860,470 1990,370 2050,290" fill="none" stroke="#8de0ff" stroke-width="2.5" stroke-opacity="0.6"/>
</svg>

