<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Classic Windows XP wavy 4-color flag with specular sheen -->
  <defs>
    <filter id="xpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b52"/>
      <stop offset="50%" stop-color="#ea3922"/>
      <stop offset="100%" stop-color="#b81c09"/>
    </linearGradient>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93e445"/>
      <stop offset="50%" stop-color="#69b820"/>
      <stop offset="100%" stop-color="#46850c"/>
    </linearGradient>
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ea2f8"/>
      <stop offset="50%" stop-color="#1872df"/>
      <stop offset="100%" stop-color="#0a4697"/>
    </linearGradient>
    <linearGradient id="flagYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb55"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#d98200"/>
    </linearGradient>
  </defs>
  
  <g filter="url(#xpGlow)">
    <!-- Red Pane (Top-Left) -->
    <path d="M 6 11 C 12 7, 18 13, 23 9 L 23 23 C 18 27, 12 21, 6 25 Z" fill="url(#flagRed)"/>
    <!-- Green Pane (Top-Right) -->
    <path d="M 26 8 C 32 4, 38 10, 43 7 L 43 21 C 38 24, 32 18, 26 22 Z" fill="url(#flagGreen)"/>
    <!-- Blue Pane (Bottom-Left) -->
    <path d="M 6 27 C 12 23, 18 29, 23 25 L 23 39 C 18 43, 12 37, 6 41 Z" fill="url(#flagBlue)"/>
    <!-- Yellow Pane (Bottom-Right) -->
    <path d="M 26 24 C 32 20, 38 26, 43 23 L 43 37 C 38 40, 32 34, 26 38 Z" fill="url(#flagYellow)"/>
    
    <!-- Glossy Highlights -->
    <path d="M 7 12 C 12 8, 17 13, 22 10" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 27 9 C 32 5, 37 10, 42 8" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>

