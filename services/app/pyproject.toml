[project]
name = "embervault-app"
version = "1.0.0"
description = "EmberVault web GUI application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "embervault-common",
    "embervault-db",
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "flask-babel>=4.0.0",
    "gunicorn>=23.0.0",
    "requests>=2.32.0",
    "apscheduler>=3.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
