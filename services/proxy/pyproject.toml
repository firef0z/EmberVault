[project]
name = "embervault-proxy"
version = "1.0.0"
description = "EmberVault worker proxy for executing RClone tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "embervault-common",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
